<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">

  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>

 <div class="header">

  <div class="profile">
   
    <img id="fotoMitra" src="default.png" alt="">
    
    

    <div class="nama-mitra">
  <div id="judul">Mitra</div>
  <small id="ratingMitra">⭐ 0.0</small>
    </div>
   </div>
  </div>



<!-- TOP MENU (SUDAH SESUAI CSS KAMU) -->




<audio id="notifSound" src="uploads/ring.mp3" preload="auto"></audio>
<div id="list"></div>

<div id="emptyText" class="empty-text"></div>


<div class="bottom-nav">

  <button class="nav-item" onclick="showActive()" id="btnActive">
    <i class="fa-solid fa-house"></i>
    <small>Aktif</small>
  </button>

  <button class="nav-item" onclick="showAkun()" id="btnAkun">
  <i class="fa-solid fa-user"></i>
 <small>Akun</small> 
</button>

  <button class="nav-item" onclick="showHistory()" id="btnHistory">
   <i class="fa-solid fa-clock-rotate-left"></i>
    <small>History</small>
  </button>

  <button class="nav-item" onclick="showSaldo()" id="btnSaldo"> 
  <i class="fa-solid fa-wallet"></i>
  <span>Saldo</span>
</button>

  <!-- ONLINE/OFFLINE TETAP ADA, TAPI STYLE IKUT UI USER -->
  <button class="nav-item" onclick="toggleOnline()" id="onlineBtn">
   <i class="fa-solid fa-signal"></i>
    <small id="statusText">Offline</small>
  </button>

  </div>
<button class="logout-float" onclick="logout()">
  <i class="fa-solid fa-right-from-bracket"></i>
</button>


<div id="logoutModal" class="logout-modal">
  <div class="logout-box">
    <p>Keluar dari akun?</p>

    <div class="logout-action">
      <button onclick="closeLogout()" class="btn-cancel">Batal</button>
      <button onclick="doLogout()" class="btn-logout">Logout</button>
    </div>
  </div>
</div>

<div id="cancelModal" class="logout-modal">
  <div class="logout-box">
    <p>Batalin order ini?</p>

    <div class="logout-action">
      <button onclick="closeCancel()" class="btn-cancel">Tidak</button>
      <button onclick="doCancel()" class="btn-logout">Ya, Cancel</button>
    </div>
  </div>
</div>

<script src="cordova.js"></script>

<script>
let exitApp = false;

window.addEventListener("popstate", function (event) {

  if (!exitApp) {

    exitApp = true;

  

    setTimeout(() => {
      exitApp = false;
    }, 2000);

  } else {

    window.close();
    document.location.href = "about:blank";
  }

});

// push state agar back bisa ditangkap
history.pushState(null, null, location.href);
</script>

<script>


  function setActive(id){
  document.querySelectorAll(".nav-item")
    .forEach(el => el.classList.remove("active"));

  const el = document.getElementById(id);
  if(el) el.classList.add("active");
}

document.addEventListener('deviceready', function () {
    
    FirebasePlugin.createChannel(
  {
    id: "order_channel",
    name: "Order Notification",
    importance: 4,
    sound: "go"
  },
  function () {
    console.log("CHANNEL CREATED");
  },
  function (error) {
    console.log("CHANNEL ERROR", error);
  }
);

  const permissions = cordova.plugins.permissions;

  // =====================
  // 1. GPS PERMISSION
  // =====================
  permissions.checkPermission(
    permissions.ACCESS_FINE_LOCATION,
    function (status) {

      if (!status.hasPermission) {

        permissions.requestPermission(
          permissions.ACCESS_FINE_LOCATION,
          function () {

            console.log("GPS diizinkan");
            startGPS(); // ✅ jalan setelah approve

          },
          function () {
            console.log("GPS ditolak");
          }
        );

      } else {

        // ⭐ PENTING: kalau sudah ada izin, tetap jalanin GPS
        startGPS();

      }

    }
  );

  // =====================
  // 2. NOTIFIKASI FCM
  // =====================
  FirebasePlugin.hasPermission(function (granted) {

    if (!granted) {

      FirebasePlugin.grantPermission(
        function () {
          console.log("Notif diizinkan");
        },
        function (error) {
          console.log("Notif ditolak", error);
        }
      );

    }

  });

  // =====================
  // 3. TOKEN FCM
  // =====================
  const mitra = JSON.parse(localStorage.getItem("mitra"));

  if (!mitra) {
    console.log("MITRA BELUM LOGIN");
    return;
  }

  FirebasePlugin.getToken(function (token) {

    console.log("TOKEN MITRA:", token);

    fetch("https://nodejs-production-fea7.up.railway.app/api/save-token", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        user_id: mitra.id,
        role: "mitra",
        token: token
      })
    })
    .then(r => r.json())
    .then(data => {
      console.log("SAVE TOKEN:", data);
    });

  }, function (error) {
    console.log("FCM ERROR:", error);
  });

}, false);


   

    FirebasePlugin.onMessageReceived(function(message) {

    console.log("FCM MASUK:", message);

    const title = message.data?.title;
    const body = message.data?.body;

    // 🔊 suara
    const audio = document.getElementById("notifSound");
    if (audio) {
        audio.pause();
        audio.currentTime = 0;
        audio.play().catch(()=>{});
    }

    // 📳 getar
    if (navigator.vibrate) {
        navigator.vibrate(300);
    }

    // 📲 tampilkan notif custom
    alert(title + "\n" + body);

});
</script>

<script>
function logout() {
  document.getElementById("logoutModal").style.display = "flex";
}

function closeLogout() {
  document.getElementById("logoutModal").style.display = "none";
}

function doLogout() {
  localStorage.removeItem("mitra");
  window.location.replace("index.html");
}

</script>

<script src="js/mitra.js"></script>


</body>
</html>
