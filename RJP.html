let online = false;

function renderStatus() {

  const text = document.getElementById("statusText");
  const btn = document.getElementById("onlineBtn");

  if (online) {
    text.innerText = "Online";
    btn.classList.add("online");
    btn.classList.remove("offline");
  } else {
    text.innerText = "Offline";
    btn.classList.add("offline");
    btn.classList.remove("online");
  }

}

/* =========================
   TOGGLE ONLINE
========================= */
async function toggleOnline() {

  online = !online;
  renderStatus();

  await fetch(API + "/update-status-mitra", {
    method: "POST",
    headers: {
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      driver_id,
      status: online ? "online" : "offline"
    })
  });

  // 🔥 INI PENTING
  if (online) {
    socket.emit("join-mitra", driver_id);
  } else {
    socket.emit("leave-mitra", driver_id);

}

function formatWA(phone) {
  if (!phone) return "";

  phone = phone.replace(/[^0-9]/g, "");

  if (phone.startsWith("0")) {
    phone = "62" + phone.slice(1);
  }

  return phone;
}

function getButton(status, id, phone, orderGender, mitraGender, lat, lng) {

  if (!online) {
    return `
      <button disabled>
        OFFLINE
      </button>
    `;
  }

  let wa = "";
  if (phone) {
    wa = phone.replace(/[^0-9]/g, "");
    if (wa.startsWith("0")) {
      wa = "62" + wa.slice(1);
    }
  }

  if (status === "pending") {

    // 🔒 filter gender tetap kamu pakai
    /*if (orderGender !== "bebas" && orderGender !== mitraGender) {
      return `
        <button disabled style="background:#ccc">
          ❌ Tidak Sesuai Gender
        </button>
      `;
    } */

    return `
      <button class="btn-ambil" onclick="ambil(${id})">
        🚀 Ambil
      </button>
    `;
  }

  if (status === "diambil") {
    return `
      <button class="btn-wa"
        onclick="window.open('https://wa.me/${wa}','_blank')">
        💬 WhatsApp
      </button>

      <button class="btn-proses"
        onclick="ubahStatus(${id}, 'menuju_lokasi')">
        🚗 Berangkat

       ${(lat !== null && lng !== null && !isNaN(lat) && !isNaN(lng)) ? `
  <button class="btn-map"
    onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}')"
    
  </button>
` : ""}

      <button class="btn-cancel"
        onclick="cancelOrder(${id})">
        Cancel
      </button>
    `;
  }

  if (status === "menuju_lokasi") {
    return `
      <button class="btn-proses"
        onclick="ubahStatus(${id}, 'dikerjakan')">
        💆 Mulai Pijat
      </button>

      <button class="btn-cancel"
        onclick="cancelOrder(${id})">
        Cancel
      </button>
    `;
  }

  if (status === "dikerjakan") {
    return `
      <button class="btn-selesai"
        onclick="ubahStatus(${id}, 'selesai')">
        ✅ Selesai
      </button>
    `;
  }

  return "";
}

function hitungJarak(lat1, lon1, lat2, lon2) {

  const R = 6371; // km

  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c;
}


function formatJarak(km) {
  return km < 1
    ? `${(km * 1000).toFixed(0)} m`
    : `${km.toFixed(1)} km`;
}

let map;
let marker;

function initMap() {

  map = L.map("map").setView(
    [-6.2, 106.8],
    13
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        "&copy; OpenStreetMap"
    }
  ).addTo(map);

  marker = L.marker(
    [-6.2, 106.8]
  ).addTo(map);

}

/* =========================
   GPS REALTIME
========================= */
navigator.geolocation.watchPosition(
  (pos) => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    driverLat = lat;
    driverLng = lng;

    socket.emit("send-location", {
      driver_id,
      lat,
      lng
    });

  },
  null,
  {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 5000
  }
);

/* =========================
   TERIMA LOKASI
========================= */
socket.on(
  "mitra-location",
  (data) => {

    if (
      data.driver_id != driver_id
    ) return;

    const posisi = [
      data.lat,
      data.lng
    ];

    if (marker) {
      marker.setLatLng(posisi);
    }

    if (map) {
      map.setView(posisi, 15);
    }

  }
);
