<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>hygen-login</title>

<style>

/* =========================
   BODY
========================= */
body{
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
  background:#f5f5f5;

  display:flex;
  justify-content:center;
  align-items:center;

  height:100vh;
}

/* =========================
   LOGIN BOX
========================= */
.login-box{
  width:90%;
  max-width:350px;

  background:white;
  padding:30px 20px;

  border-radius:20px;

  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

/* =========================
   TITLE
========================= */
h2{
  text-align:center;
  margin-bottom:25px;
  color:#222;
}

/* =========================
   INPUT
========================= */
input{
  width:100%;
  padding:14px;

  border:1px solid #ddd;
  border-radius:12px;

  font-size:15px;
  box-sizing:border-box;

  margin-bottom:15px;
}

input:focus{
  outline:none;
  border-color:#2196f3;
}

/* =========================
   BUTTON
========================= */
button{
  width:100%;

  border:none;
  padding:14px;

  background:#2196f3;
  color:white;

  border-radius:12px;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;
}

button:active{
  transform:scale(0.98);
}

</style>
</head>

<body>

<div class="login-box">

  <h2>Login Mitra</h2>

  <input id="username" placeholder="Username">

  <input id="password" type="password" placeholder="Password">

  <button onclick="login();">
  Login
</button>

</div>
<script>

const API = "https://nodejs-production-fea7.up.railway.app";


async function login() {

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const device_id = getDeviceId();

  try {

    const res = await fetch(API + "/login-mitra", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username,
        password,
        device_id   // 🔥 TAMBAH INI
      })
    });

    const data = await res.json();

    console.log(data);

    if (data.success) {

      localStorage.setItem("mitra", JSON.stringify(data.mitra));
      localStorage.setItem("token", data.token);

      alert("Login berhasil");

      window.location.replace("RJP.html");

    } else {
      alert(data.message);
    }

  } catch (err) {
    alert("Server tidak terhubung");
    console.log(err);
  }
}
/*satu device */
function getDeviceId() {
  let deviceId = localStorage.getItem("device_id");

  if (!deviceId) {
    deviceId = crypto.randomUUID();
    localStorage.setItem("device_id", deviceId);
  }

  return deviceId;
}
</script>

</body>
</html>
